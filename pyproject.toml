[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-improve"
version = "0.1.0"
description = "Controlled DUET action residual experiments for R2R"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.6", "numpy>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
duet = ["transformers==4.30.2", "h5py>=3.10,<4", "networkx>=2.8,<4", "jsonlines>=2,<5", "tqdm>=4.62", "tensorboardX>=2.6", "line-profiler>=4", "shapely>=2,<3", "easydict>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
